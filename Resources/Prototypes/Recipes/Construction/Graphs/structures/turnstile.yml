- type: constructionGraph
  id: EnergyGate
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity { }
    edges:
    - to: energyGate
      completed:
      - !type:SnapToGrid
      steps:
      - material: MetalRod
        amount: 4
        doAfter: 20 # TRIESTE: Added.
      - material: Steel
        amount: 1
        doAfter: 40 # TRIESTE: '6'

  - node: energyGate
    entity: EnergyGate
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 4
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 40 # TRIESTE: '4'
      - tool: Cutting
        doAfter: 20 # TRIESTE: '2'
      - tool: Screwing
        doAfter: 20 # TRIESTE: Added.
