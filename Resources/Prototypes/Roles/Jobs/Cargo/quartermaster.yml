- type: job
  id: Quartermaster
  name: job-name-qm
  description: job-description-qm
  playTimeTracker: JobQuartermaster
  requirements:
    - !type:RoleTimeRequirement
      role: JobCargoTechnician
      time: 2.5h # TRIESTE: '5h'
   # - !type:RoleTimeRequirement # TRIESTE: Replaced with exped time.
   #   role: JobSalvageSpecialist
   #   time: 2.5h
    - !type:DepartmentTimeRequirement
      department: TP14DepartmentExpeditions
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Cargo
      time: 2.5h # TRIESTE: '5'
  startingGear: QuartermasterGear
  icon: "TP14JobIconHarbormaster" # TRIESTE: 'JobIconQuartermaster'
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Cargo
  - Salvage
  - Quartermaster
  - Maintenance
  - External
  - Command
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: QuartermasterGear
  equipment:
    id: QuartermasterPDA
    ears: ClothingHeadsetQM
    belt: BoxFolderClipboardThreePapers
    pocket1: AppraisalTool
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: QuartermasterChameleonOutfit
  job: Quartermaster
  hasMindShield: true
  equipment:
    head: ClothingHeadHatQMsoft
    eyes: ClothingEyesGlassesSunglasses
    mask: TP14ClothingMaskAir #TP14
    outerClothing: ClothingOuterWinterQM
    neck: ClothingNeckCloakQm
    gloves: ClothingHandsKnuckleDustersQM
