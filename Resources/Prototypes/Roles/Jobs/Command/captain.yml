- type: job
  id: Captain
  name: job-name-captain
  description: job-description-captain
  playTimeTracker: JobCaptain
  requirements:
    - !type:OverallPlaytimeRequirement # TRIESTE
      time: 10h
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 2h # TRIESTE '4'
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 2h # TRIESTE: '4'
    - !type:DepartmentTimeRequirement
      department: Science
      time: 2h # TRIESTE: '4'
    - !type:DepartmentTimeRequirement
      department: Security
      time: 2h # TRIESTE: '4'
    - !type:DepartmentTimeRequirement
      department: Command
      time: 2h # TRIESTE: '4'
  startingGear: CaptainGear
  icon: "TP14JobIconOverseer" # TRIESTE: 'JobIconCaptain'
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: CaptainGear
  equipment:
    shoes: ClothingShoesBootsLaceup
#    eyes: ClothingEyesGlassesCommand   # MOFF: Eyepatches!
    gloves: ClothingHandsGlovesCaptain  # TRIESTE: 'ClothingHandsGlovesCaptain'
    id: TP14OverseerPDA                 # TRIESTE: 'CaptainPDA'
    ears: ClothingHeadsetAltCommand
  storage:
    back:
    - Flash
    # - StationCharter

- type: chameleonOutfit
  id: CaptainChameleonOutfit
  job: Captain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap
