- type: job
  id: HeadOfSecurity
  name: job-name-hos
  description: job-description-hos
  playTimeTracker: JobHeadOfSecurity
  requirements:
    - !type:RoleTimeRequirement
      role: JobWarden
      time: 1h # TRIESTE: '3'
    - !type:RoleTimeRequirement
      role: JobDetective
      time: 1h # knowing how to use the tools is important
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 2.5h # TRIESTE: '5'
    - !type:DepartmentTimeRequirement
      department: Security
      time: 5h # TRIESTE: '10'
  startingGear: HoSGear
  icon: "TP14JobIconMarshal" # TRIESTE: 'JobIconHeadOfSecurity'
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: HoSGear
  equipment:
    # eyes: ClothingEyesGlassesSecurity # Moffstation - Eyepatches!
    id: HoSPDA
    gloves: ClothingHandsGlovesCombat
    ears: ClothingHeadsetAltSecurity
    pocket1: WeaponRevolverDeckard
  storage:
    back:
    - Flash
    - SpeedLoaderMagnum

- type: chameleonOutfit
  id: HeadOfSecurityChameleonOutfit
  job: HeadOfSecurity
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretHoS
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckCloakHos
