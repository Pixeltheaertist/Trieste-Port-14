- type: entity
  parent: VendingMachine
  id: VendingMachineSwimsuits
  name: SwimVend
  description: A vending machine for swimsuits.
  components:
  - type: VendingMachine
    pack: SwimvendInventory
  - type: VendingMachineVisuals # off/broken/normal states are inherited from VendingMachine
    denyState: deny-unshaded
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _TP/Structures/Machines/VendingMachines/swimvend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#e0e0e0"
