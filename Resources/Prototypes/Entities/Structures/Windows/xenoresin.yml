- type: entity
  parent: ReinforcedWindow
  id: XenoResinWindow
  name: resin window
  description: Transparent and hardened, yet slightly sticky to the touch.
  components:
  - type: Sprite # TRIESTE: old wall/window sprites, see _TP/Structures
    drawdepth: WallTops
    sprite: _TP/Structures/Windows/xeno_resin.rsi
  - type: Icon # TRIESTE: old wall/window sprites, see _TP/Structures
    sprite: _TP/Structures/Windows/xeno_resin.rsi
  - type: IconSmooth # TRIESTE: old wall/window sprites, see _TP/Structures
    key: windows
    states:
    - !type:CornerSpriteSmoothing # old-style corner sprites
      mask: [ windows ]
      base: xwindow
