- type: entity
  parent: [BaseDeltaPressureReinforcedGlass, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrierStrong]
  id: ShuttleWindow
  name: shuttle window
  components:
  - type: Sprite # TRIESTE: old wall/window sprites, see _TP/Structures
    drawdepth: WallTops
    sprite: _TP/Structures/Windows/shuttle_window.rsi
  - type: Icon # TRIESTE: old wall/window sprites, see _TP/Structures
    sprite: _TP/Structures/Windows/shuttle_window.rsi
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
  - type: IconSmooth # TRIESTE: old wall/window sprites, see _TP/Structures
    key: windows
    states:
    - !type:CornerSpriteSmoothing # old-style corner sprites
      mask: [ windows ]
      base: swindow
  - type: Construction
    graph: Window
    node: shuttleWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 150

- type: entity
  parent: ShuttleWindow
  id: ShuttleWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite # TRIESTE: old wall/window sprites, see _TP/Structures
    drawdepth: WallTops
    sprite: _TP/Structures/Windows/shuttle_window_diagonal.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    states:
    - !type:DiagonalSpriteSmoothing
      mask:
      - walls
      - windows
      - grilles
      - marble
      - doors
      base: state
  - type: Icon # TRIESTE: old wall/window sprites, see _TP/Structures
    sprite: _TP/Structures/Windows/shuttle_window_diagonal.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
