#TODO: Someone should probably move the ore vein prototypes into their own file, or otherwise split this up in some way. This should not be 1.5k lines long.
# I halved it, but we could still split the planet walls from the asteroid walls. Or prototype generation.

# Anyway
# See WallRock variants for the remappings.

- type: entity
  abstract: true
  parent: BaseWall
  id: BaseAsteroidRock
  components:
  - type: Transform
    noRot: true
  - type: IconSmooth
    key: stone
    states:
    - !type:CornerSpriteSmoothing
      mask: [ stone, doors ]
      base: stone
      index: 0
  - type: Icon
    state: full
  - type: Sprite
    drawdepth: Walls
  - type: MiningScannerViewable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

- type: entity
  abstract: true
  parent: StructureHealthBarrierWeak
  id: BaseAsteroidDestructible
  components:
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - &SoundStoneBreak !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

#region BaseVein

- type: entity
  abstract: true
  parent: BaseStructureHealth
  id: BaseRockGibtonite
  suffix: Gibtonite
  components:
  - type: Sprite
    layers:
    - state: gibtonite_inactive
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay", "gib" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        "gib":
          Primed:
            state: gibtonite_active
            shader: unshaded
            visible: true
          Unprimed:
            state: gibtonite_inactive
            visible: false
  - type: TimerTrigger
    examinable: false
    beepInterval: 0.4
    beepSound:
      collection: GlassCrack
  - type: RandomTimerTrigger
    min: 8
    max: 10
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 450
    intensitySlope: 2.5
    maxIntensity: 10
    canCreateVacuum: false
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3
      behaviors:
      - !type:TimerStartBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 500 # you have to really smack it for it to manually detonate. re-examine once defusal exists
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:TriggerBehavior
        keyOut: timer # explode immediately

