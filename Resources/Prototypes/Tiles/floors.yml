- type: tile
  abstract: true
  id: BaseStationTile
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepFloor
  heatCapacity: 10000
#  weather: false # TRIESTE: 'true'
  baseTurf: Plating
  baseWhitelist:
  - FloorAsteroidIronsand
  - FloorAsteroidSand
  - FloorAsteroidSandBorderless
  - FloorAsteroidIronsandBorderless
  - PlatingAsteroid
  - PlatingSnow
  - FloorPlanetDirt
  - FloorDesert
  - FloorPlanetGrass
  - FloorSnow
  - FloorDirt
  - PlatingRCD
  - FloorHullReinforced
  materialComposition:
    Steel: 100 # 0.5 for lattice, 0.25 for plating, 0.25 for tile

- type: tile
  id: FloorSteelCheckerLight
  parent: BaseStationTile
  name: tiles-steel-floor-checker-light
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/cafeteria.png
  variants: 4
