- type: tile
  id: BasePlating
  abstract: true
  friction: 1.5
  heatCapacity: 10000
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  materialComposition:
    Steel: 75 # 0.75 sheets; 0.5 for the lattice, 0.25 for the tile
  baseTurf: Lattice

- type: tile
  id: Plating
  parent: BasePlating
  name: tiles-plating
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/plating.png

- type: tile
  id: PlatingDamaged
  parent: BasePlating
  name: tiles-plating
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/plating_damaged.png
  variants: 3

- type: tile
  id: PlatingRCD
  parent: Plating
  name: tiles-rcd-plating
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/plating.png
  baseWhitelist:
    - Space
    - FloorPlanetDirt
    - FloorDesert
    - FloorPlanetGrass
    - FloorSnow
    - FloorDirt
    - FloorAsteroidIronsand
    - FloorAsteroidSand
    - FloorAsteroidSandBorderless
    - FloorAsteroidIronsandBorderless

- type: tile
  id: FloorHullReinforced
  parent: BasePlating
  name: tiles-hull-reinforced
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/hull_reinforced.png
  footstepSounds:
    collection: FootstepHull
  itemDrop: FloorTileItemSteel
  heatCapacity: 100000 #/tg/ has this set as "INFINITY." I don't know if that exists here so I've just added an extra 0
  indestructible: true

- type: tile
  id: PlatingAsteroid
  parent: BasePlating
  name: tiles-asteroid-plating
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/Asteroid/asteroid_plating.png

- type: tile
  id: PlatingSnow
  name: tiles-snow-plating
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/snow_plating.png #Not in the snow planet RSI because it doesn't have any metadata. Should probably be moved to its own folder later.
  parent: BasePlating
  friction: 0.75 #a little less then actual snow

- type: tile
  id: Lattice
  name: tiles-lattice
  # TRIESTE: pre-respriting tile look, see /Textures/_TP/Tiles
  sprite: /Textures/_TP/Tiles/lattice.png
  variants: 1
  baseTurf: Space
  isSubfloor: true
  deconstructTools: [ Cutting ]
  weather: true
  footstepSounds:
    collection: FootstepCatwalk
  friction: 1.5
  isSpace: true
  itemDrop: PartRodMetal1
  indestructible: true
  heatCapacity: 10000
  mass: 200
  materialComposition:
    Steel: 50 # 0.5 sheets = 1 rod
