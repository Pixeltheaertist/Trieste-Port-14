- type: entity
  parent: BoxCardboard
  id: CrimeCleanerKit
  suffix: Trieste, NanoTraitor
  name: evidence cleaning kit
  description: A kit designed to clean any evidence of a crime. Contains soap, space cleaner, nitrile gloves and a cleanade.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: TP14SoapNT
        - id: SprayBottleSpaceCleaner
        - id: CleanerGrenade
        - id: ClothingHandsGlovesNitrile

- type: entity
  parent: BoxVial
  id: LubeBoxNT
  suffix: Trieste, NanoTraitor
  name: space lube box
  description: A box containing three vials of space lube.
  components:
  - type: Storage
    grid:
    - 0,0,3,2
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: TP14SmallChemistryVialLube
        amount: 3

