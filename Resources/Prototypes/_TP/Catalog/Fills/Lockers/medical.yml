- type: entityTable
  id: TP14EntityTableLockerFillMedicine
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: TP14EntityTableMedicineReagentBottles
      rolls: 2
    - !type:GroupSelector # Basic topicals
      rolls: 7
      children:
      - id: Brutepack
      - id: Ointment
      - id: Bloodpack
      - id: Gauze
        weight: 0.5


## ENTITIES ##
- type: entity
  parent: LockerMedicineFilled
