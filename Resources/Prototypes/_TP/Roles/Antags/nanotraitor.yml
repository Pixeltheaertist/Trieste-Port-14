# Keeps TraitorRole from MindRoleTraitor so upstream traitor objectives and systems still apply.
- type: entity
  parent: MindRoleTraitor
  id: TP14MindRoleNanoTraitor
  name: NanoTrasen Traitor Role
  components:
  - type: MindRole
    antagPrototype: NanoTraitor
    subtype: role-subtype-nanotraitor
  - type: NanoTraitorRole
