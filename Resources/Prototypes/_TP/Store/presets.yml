- type: entity
  id: StorePresetUplinkNT
  abstract: true
  components:
  - type: Store
    name: store-preset-name-uplink-nt
    categories:
    - UplinkNtWeaponry
    - UplinkNtAmmo
    - UplinkNtExplosives
    - UplinkNtChemicals
    - UplinkNtDeception
    - UplinkNtDisruption
    - UplinkNtImplants
    - UplinkNtAllies
    - UplinkNtWearables
    - UplinkNtJob
    - UplinkNtPointless
    currencyWhitelist:
    - TP14CurrencyBluespaceCrystal
    balance:
      TP14CurrencyBluespaceCrystal: 0

# Remote store used by NanoTraitor uplinks. Lives in nullspace and is opened by a PDA ringer code or UplinkImplantNT.
- type: entity
  parent: StorePresetUplinkNT
  id: TP14StorePresetRemoteUplinkNT
  categories: [ HideSpawnMenu ]
  components:
  - type: Store
    expectedFaction:
    - NanoTrasenTraitor
  - type: RingerAccessUplink
