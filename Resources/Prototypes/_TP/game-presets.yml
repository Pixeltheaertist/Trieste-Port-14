#For Admin Use: Runs Greenshift but shows "Secret" in lobby.
- type: gamePreset
  id: SecretGreenshift
  alias:
  - secretgreenshift
  name: secret-title
  showInVote: false
  description: secret-description
  rules:
  - BasicRoundstartVariation

- type: gamePreset
  id: Longpast
  alias:
  - longpast
  - lp
  name: long-past-title
  description: long-past-description
  maxPlayers: 25
  showInVote: true
  supportedMaps: LongPastPool

- type: gamePreset
  id: SafeHarbor
  alias:
  - safeharbor
  - crashedship
  - ThatOneFuckedShip
  - floatsam
  - flotsam
  name: safe-harbor-title
  showInVote: false
  description: safe-harbor-description
  supportedMaps: SafeHarborPool
  rules:
  - BasicRoundstartVariation

# TP14 copies of upstream presets, using our own event schedulers (see GameRules/schedulers.yml).
# Upstream's SpaceTrafficControlEventScheduler and meteor schedulers are left out, since we had those disabled.

- type: gamePreset
  id: TP14Survival
  alias:
  - tp14survival
  name: survival-title
  showInVote: false # secret
  description: survival-description
  rules:
  - TP14RampingStationEventScheduler
  - BasicRoundstartVariation

