# Pre-respriting tiles that upstream removed (#44857) but Trieste maps still use.
# Upstream's tile_migrations.yml aliases the old IDs, so these live under TP14 IDs and the
# Trieste maps' tilemaps point at them.

- type: tile
  id: TP14FloorAsphalt
  name: tiles-asphalt
  sprite: /Textures/_TP/Tiles/Planet/Concrete/asphalt.png
  variants: 10
  baseTurf: FloorDirt
  isSubfloor: true
  footstepSounds:
    collection: FootstepTile
  heatCapacity: 10000
  weather: true

- type: tile
  id: TP14FloorAsteroidSandDug
