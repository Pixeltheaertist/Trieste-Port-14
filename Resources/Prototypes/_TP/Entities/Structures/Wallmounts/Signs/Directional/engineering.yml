# Atmospherics
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalAtmos, TP14SignDirectionalAtmosAlt1, TP14SignDirectionalAtmosAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Engi, Atmos, Wall-Sign
  name: atmos wall sign
  description: A direction sign, pointing out which way the Atmospherics department is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background # Colorable background layer
      color: "#FFC300" # Yellow-ish Orange
    - state: text_atmos # The text

