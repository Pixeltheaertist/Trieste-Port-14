# Cryo
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalCryo, TP14SignDirectionalCryoAlt1, TP14SignDirectionalCryoAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Civilian, Wall-Sign
  name: cryo wall sign
  description: A direction sign, pointing out which way cryogenic stasis is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background
      color: "#C4A484" # Light-brown
    - state: text_cryo

