# Chem
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalChem, TP14SignDirectionalChemAlt1, TP14SignDirectionalChemAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Medical, Wall-Sign
  name: chem wall sign
  description: A direction sign, pointing out which way the chem lab is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background
      color: "#008008" # Green. Had to hehe.
    - state: text_chem

