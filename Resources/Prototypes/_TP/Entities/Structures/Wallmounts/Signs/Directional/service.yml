# Aquaponics
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalAquaponics, TP14SignDirectionalAquaponicsAlt1, TP14SignDirectionalAquaponicsAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Service, Wall-Sign
  name: aquaponics wall sign
  description: A direction sign, pointing out which way the Aquaponics department is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background
      color: "#90EE90" # Light-green
    - state: text_aqua

