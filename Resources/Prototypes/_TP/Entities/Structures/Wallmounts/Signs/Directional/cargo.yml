# Expeditionary
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalExped, TP14SignDirectionalExpedAlt1, TP14SignDirectionalExpedAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Exped, Wall-Sign
  name: expeditionary wall sign
  description: A direction sign, pointing out which way the Expeditionary department is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background
      color: "#808080" # Gray
    - state: text_exped

