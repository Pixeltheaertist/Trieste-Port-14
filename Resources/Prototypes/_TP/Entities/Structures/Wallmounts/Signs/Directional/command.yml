# Bridge
- type: entity
  parent: TP14BaseSignDirectional
  id: !type:CreateVariants
    values: [ TP14SignDirectionalBridge, TP14SignDirectionalBridgeAlt1, TP14SignDirectionalBridgeAlt2 ]
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  suffix: Trieste, Command, Wall-Sign
  name: bridge wall sign
  description: A direction sign, pointing out which way the command bridge is.
  components:
  - type: Sprite
    offset: !type:CreateVariants
      values: [ "0, 0", "0, 0.25", "0, -0.25" ]
    layers:
    - state: overlay
    - state: background
      color: "#6AB094" # Seafoam green
    - state: text_bridge

