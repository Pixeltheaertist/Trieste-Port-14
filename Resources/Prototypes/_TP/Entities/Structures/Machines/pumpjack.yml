- type: entity
  parent: [ BaseMachinePowered, SolutionGinormous ]
  id: Pumpjack
  suffix: Trieste
  name: pumpjack
  description: A machine used to liberate oil from deep underground.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _TP/Structures/Machines/pumpjack.rsi
    state: pumpjack-new
    drawdepth: Mobs
  - type: Anchorable
    flags: [ None ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-1.0,1.2,-0.5"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Appearance
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: CrudeOil
        Quantity: 1
  - type: DumpableSolution
    solution: solution
  - type: DrainableSolution
    solution: solution

