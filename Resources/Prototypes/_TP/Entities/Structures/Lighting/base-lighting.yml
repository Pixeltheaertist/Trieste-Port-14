- type: entity
  parent: PoweredSmallLightEmpty
  id: TP14EmptyCageLight
  name: cage light
  suffix: Trieste, Empty
  components:
  - type: Sprite
    sprite: _TP/Structures/Wallmounts/Lighting/cage_light.rsi
    state: empty

- type: entity
  parent: TP14EmptyCageLight
  id: TP14CageLight
  suffix: Trieste
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
  - type: PoweredLight
    hasLampOnSpawn: LightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: &popup powered-light-component-burn-hand

- type: entity
  parent: TP14EmptyCageLight
  id: TP14DimCageLight
  suffix: Trieste, Dim
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
    radius: 5
    energy: 0.5
    softness: 3
    color: "#ba473f"
  - type: PoweredLight
    hasLampOnSpawn: DimLightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 1
    popupText: *popup

- type: entity
