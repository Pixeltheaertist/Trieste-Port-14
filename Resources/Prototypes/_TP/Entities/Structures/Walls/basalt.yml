# Basalt rock walls. Upstream merged these into WallRock (#44857) and migrates them away;
# Trieste maps use thousands of them, so they're restored here with their pre-respriting look,
# and the WallRockBasalt* lines in migration.yml are commented out (# TRIESTE).

- type: entity
  parent: WallRock
  id: WallRockBasalt
  name: basalt
  components:
  - type: Icon
    sprite: _TP/Structures/Walls/rock.rsi
    state: rock_wall
  - type: Sprite
    sprite: _TP/Structures/Walls/rock.rsi
    layers:
    - state: rock_wall
  - type: IconSmooth
    key: walls
    states:
    - !type:EdgeSpriteSmoothing
      mask: [ walls, stone ]
      base: rock_wall_

- type: entity
  parent: [ BaseVeinCoal, WallRockBasalt ]
  id: WallRockBasaltCoal
  components:
  - type: Sprite
    sprite: _TP/Structures/Walls/rock.rsi
    layers:
    - state: rock_wall
    - state: rock_coal
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

