#Sweetwater walls
- type: entity
  parent: WallSolid
  suffix: Trieste, Sweetwater
  id: TP14WallPressurized
  name: pressurized wall
  components:
  - type: Sprite
    sprite: _TP/Structures/Walls/pressurizedwall.rsi
  - type: Icon
    sprite: _TP/Structures/Walls/pressurizedwall.rsi
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing # old-style corner sprites (solid0-7 / reinf_over0-7)
      mask: [ walls ]
      base: solid
  - type: Construction
    graph: Girder
    node: pressurizedwall


- type: entity
  parent: WallReinforced
  suffix: Trieste, Sweetwater
