# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml

- type: entity
  parent: FoodBowlBase
  id: TP14FoodBurritoBowl
  suffix: Trieste
  name: burrito bowl
  description: A delicious burrito bowl, fresh from a spaceotle sponsored-chef!
  components:
  - type: FlavorProfile
    flavors:
    - rice
    - onion
    - meaty
    - cheesy
  - type: Sprite
    sprite:  _TP/Objects/Consumable/bowl.rsi
    layers:
    - state: bowl
    - state: burritobowl
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 18
      - ReagentId: Rice
        Quantity: 7
      - ReagentId: Protein
        Quantity: 6.5
      - ReagentId: Vitamin
        Quantity: 2
  - type: Tag
    tags:
    - Meat
    - Fruit
    - Soup
