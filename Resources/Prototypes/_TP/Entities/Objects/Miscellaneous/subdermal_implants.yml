# Opens the NanoTraitor's remote store (TP14StorePresetRemoteUplinkNT), same as upstream's UplinkImplant.
- type: entity
  parent: [ BaseSubdermalImplant, BaseNanotrasenContraband ]
  categories: [ HideSpawnMenu ]
  id: TP14UplinkImplantNT
  name: NT uplink implant
  description: This implant lets the user access a hidden NT uplink at will.
  suffix: Trieste, Implant, NanoTraitor
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenUplinkImplant
    whitelist:
      components:
      - Hands # prevent mouse buying grenade penguin since its not telepathic
  - type: RemoteStore
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
