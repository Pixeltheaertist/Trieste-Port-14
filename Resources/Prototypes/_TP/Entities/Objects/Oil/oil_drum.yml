  suffix: Trieste, Empty
  name: oil drum
  description: Used to store black gold
  components:
  - type: Sprite
    sprite: _TP/Structures/Storage/Drums.rsi
    noRot: true
    layers:
    - state: crude
  - type: ExaminableSolution
    solution: tank
  - type: SolutionItemStatus
    solution: tank
  - type: Item
    size: Ginormous
