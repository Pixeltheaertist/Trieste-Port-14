- type: entity
  id: HarpoonBombBullet
  name: rocket
  parent: BaseBulletTrigger
  components:
  - type: Sprite
    sprite: _TP/Objects/Weapons/Guns/Projectiles/explosive_harpoons.rsi
    layers:
      - state: explosive
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 5
    intensitySlope: 3
    totalIntensity: 50
    maxTileBreak: 0
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5


