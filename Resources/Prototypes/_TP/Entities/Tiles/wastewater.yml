- type: entity
  parent: SolutionTile
  id: TP14WasteWaterOcean
  suffix: Trieste
  name: ocean water
  description: Salty.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _TP/Tiles/Planet/wastewater.rsi
    drawdepth: BelowFloor
    layers:
    - state: water
  - type: Solution
    id: pool
    solution:
      reagents:
      - ReagentId: SeaWater
        Quantity: 7680
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: SeaWater
        Quantity: 100
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
