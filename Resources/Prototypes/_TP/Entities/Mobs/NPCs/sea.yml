- type: entity
  parent: [ TP14BaseMobSeaLandCreature, MobCockroach, BaseSlicingRefinable ]
  id: TP14MobSeaBunny
  suffix: Trieste, Sea
  name: sea bunny
  description: An adorable bunny-like creature that lives in.. the sea!
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-sea-bunny-name
    description: ghost-role-information-sea-bunny-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 120
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: GhostTakeoverAvailable
  - type: Speech
    speechVerb: Moth
    speechSounds: Squeak
    allowedEmotes: ['Chitter', 'Squeak']
  - type: MothAccent
  - type: Sprite
    sprite: _TP/Mobs/Animals/sea-bunny.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: sea-rabbit-moving
  - type: SpriteMovement
    movementLayers:
      movement:
        state: sea-rabbit-moving
    noMovementLayers:
      movement:
        state: sea-rabbit-idle
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    sprite: _TP/Mobs/Animals/sea-bunny.rsi
    equippedPrefix: 0
    slots:
    - HEAD
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: sea-rabbit-idle
      Critical:
        Base: sea-rabbit-dead
      Dead:
        Base: sea-rabbit-dead
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      60: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
    weightlessAcceleration: 1.5
    weightlessFriction: 1
    baseWeightlessModifier: 1
  - type: Damageable
    damageModifierSet: Moth
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 20
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.5
    damageRecovery:
      types:
        Asphyxiation: -0.5
  - type: CombatMode
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSlime
      amount: 2
  - type: Extractable
    grindableSolutionName: food
  - type: ReplacementAccent
    accent: mothroach
  - type: ZombieAccentOverride
    accent: zombieMoth
  - type: Vocal
    emoteSounds: UnisexMoth
  - type: MobPrice
    price: 150
  - type: Tag
    tags:
    - Trash
    - CannotSuicide
    - VimPilot
  - type: CanEscapeInventory
  - type: NpcFactionMember
    factions:
    - Mouse
  - type: TypingIndicator
    proto: moth
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: InventorySlots
  - type: Inventory
    speciesId: hamster
    templateId: hamster
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _TP/Mobs/Animals/sea-bunny-displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: _TP/Mobs/Animals/sea-bunny-displacement.rsi
            state: mask
      suitstorage:
        sizeMaps:
          32:
            sprite: _TP/Mobs/Animals/sea-bunny-displacement.rsi
            state: suitstorage
      eyes:
        sizeMaps:
          32:
            sprite: _TP/Mobs/Animals/sea-bunny-displacement.rsi
            state: eyes
      neck:
        sizeMaps:
          32:
            sprite: _TP/Mobs/Animals/sea-bunny-displacement.rsi
            state: neck

