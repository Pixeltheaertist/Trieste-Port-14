- type: entity
  id: TP14MobDrifter
  parent: [ TP14BaseSimpleMob, TP14BaseMobSeaLandCreature, MobCombat, BaseSlicingRefinable, MobNightVision ]
  suffix: Trieste
  name: drifter
  description: A spindly, opportunistic predator which injects prey with a paralyzing agent before siphoning their blood.
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - AllHostile
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSpider
      amount: 2
  - type: CombatMode
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: SolutionManager
    solutions:
    - TP14SolutionWeaponDrifter
  - type: MeleeChemicalInjector
    transferAmount: 4
    solution: melee
  - type: Puller
    needsHands: false
  - type: NoSlip
  - type: IgnoreSpiderWeb
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 50
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter']
  - type: Vocal
    emoteSounds: UnisexArachnid
  - type: TypingIndicator
    proto: spider
  - type: Tag
    tags:
    - FootstepSound
    - TP14TagDrifter
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute from base.yml.
    allowedStates:
    - Alive
    damage:
      types:
        Poison: -0.07
        Blunt: -0.03
        Slash: -0.03
        Piercing: -0.03
        Heat: -0.03
        Cold: -0.03
        Shock: -0.03
  - type: Sprite
    drawdepth: Mobs
    sprite: _TP/Mobs/Aliens/drifters.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: drifter
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: drifter
      Dead:
        Base: drifter_dead

- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: TP14SolutionWeaponDrifter
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: DrifterToxin
        Quantity: 1
      - ReagentId: SpaceDrugs
        Quantity: 1

- type: entity
  parent: [ SolutionFood, SolutionTiny, TP14BaseSimpleMob, TP14BaseMobSeaCreature, BaseSlicingRefinable, MobNightVision ]
  id: TP14MobFish
  suffix: Trieste
  name: fish
  description: It's a fish.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: fish-0
      sprite: _TP/Mobs/Animals/fish.rsi
  - type: Item
    size: Tiny
  - type: CombatMode
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fish-0
      Dead:
        Base: splat-0
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 20
  - type: Edible
  - type: FlavorProfile
    flavors:
    - horrible
    - terrible
    - chewy
    - fishy
  - type: Hunger
    baseDecayRate: 0.25
  - type: Extractable
    grindableSolutionName: food
  - type: Speech
    speechVerb: SmallMob
    speechSounds: TP14SpeechSoundsJellid
  - type: Tag
    tags:
    - Trash
    - TP14TagFish
  - type: Reproductive
    breedChance: 0.05
    birthPopup: reproductive-laid-egg-popup
    makeOffspringInfant: false
    partnerWhitelist:
      tags:
      - TP14TagFish
    offspring:
    - id: TP14FoodEggCaviar
      maxAmount: 1
  - type: ReproductivePartner
  - type: Solution
    solution:
      reagents:
      - ReagentId: FishOil
        Quantity: 10
  - type: ToolRefinable
    refineResult:
    - id: TP14FoodMeatFish
      amount: 2
  - type: NpcFactionMember
    factions:
    - Passive
  - type: BadFood
  - type: NonSpreaderZombie
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 0

- type: entity
