# Hostage

- type: entity
  abstract: true
  parent: [ BaseTraitorObjective, BaseTargetObjective ]
  id: TP14BaseNanoTraitorHostageObjective
  components:
  - type: Objective
    issuer: TP14ObjIssuerNanoTrasen
    unique: false
    icon:
      sprite: Objects/Misc/zipties.rsi
      state: cuff
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - KillPersonCondition
  - type: SocialObjective
  - type: HostageCondition
  - type: PickRandomPerson
    conditions:
    - !type:AntagonistTagCondition
      tags:
      - OnStation
    - !type:RoleCondition
      inverted: true
      whitelist:
        components:
        - NanoTraitorRole
    - !type:ObjectiveTargetCondition
      inverted: true
      whitelist:
        components:
        - HostageCondition

- type: entity
  parent: TP14BaseNanoTraitorHostageObjective
  id: TP14NanoTraitorHostageRandomPersonObjective
  description: We have questions for them. Keep them alive, restrained and close by until the shift ends.
  components:
  - type: Objective
    difficulty: 2.5
  - type: TargetObjective
    title: objective-condition-tp14-hostage-title

- type: entity
  parent: TP14BaseNanoTraitorHostageObjective
  id: TP14NanoTraitorHostageRandomHeadObjective
  description: This head of staff is worth more to us alive. Detain them, keep them breathing, and keep them close until the shift ends.
  components:
  - type: Objective
    difficulty: 3.5
    unique: true
  - type: TargetObjective
    title: objective-condition-tp14-hostage-head-title
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      whitelist:
        components:
        - CommandStaff

# Groups

- type: weightedRandom
  id: TP14NanoTraitorObjectiveGroups
  weights:
    TP14NanoTraitorObjectiveGroupSteal: 1
    TP14NanoTraitorObjectiveGroupKill: 1
    TP14NanoTraitorObjectiveGroupState: 1
    TP14NanoTraitorObjectiveGroupSocial: 1

