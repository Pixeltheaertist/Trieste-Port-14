- type: reagent
  id: SeaWater
  name: reagent-name-seawater
  desc: reagent-desc-seawater
  physicalDesc: reagent-physical-desc-odorless
  flavor: salty
  color: "#135c4f"
  recognizable: true
  boilingPoint: 100.0
  meltingPoint: 0.0
  metabolisms:
    Respiration:
      effects:
      # Oxygenate for Jellids
      - !type:Oxygenate
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
      - !type:ModifyLungGas
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
        ratios:
          Water: -1.0
      # Drowning effects for non-Jellids
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
          inverted: true
        ignoreResistances: true
        damage:
          types:
            Cold: 0.02
      - !type:AdjustTemperature
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
          inverted: true
        - !type:TemperatureCondition
          min: 10.00
        amount: -20
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
          inverted: true
        type: Local
        messages: [ "water-in-lungs" ]
        probability: 0.7
      - !type:AdjustAlert
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Jellid, TP14WaterBreather ]
          inverted: true
        alertType: Drowning
        minScale: 1
        clear: True
        time: 6
