# TP14 station event schedulers, tables, and presets' event plumbing.
# Mirrors upstream's BasicGameRulesTable / DynamicGameRulesTable, 
# minus anything we have disabled, but tuned for MRP pacing
# If you add or modify an odd, run the command: stationevent lsprobtheoretical TP14StationEventScheduler <players> <minutes>

- type: entityTable
  id: TP14CalmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: TP14AnomalySpawn
    - id: TP14BluespaceArtifact
    - id: TP14BluespaceLocker
    - id: TP14BreakerFlip
    - id: TP14BureaucraticError
    - id: TP14ClericalError
    - id: TP14GasLeak
    - id: TP14GreytideVirus
    - id: TP14IonStorm
    - id: TP14KudzuGrowth
    - id: TP14MassHallucinations
    - id: TP14PowerGridCheck
    - id: TP14RandomSentience
    - id: TP14SlimesSpawnHorde
    - id: TP14SolarFlare
    - id: TP14SnakeSpawnHorde
    - id: TP14SpiderClownSpawnHorde
    - id: TP14SpiderSpawnHorde
    - id: TP14VendorMalfunction
    - id: TP14VentClog
    - id: TP14CloudStormEvent
    - id: TP14RainClear

- type: entityTable
  id: TP14AntagEventsTable
  table: !type:AllSelector
    children:
    - id: TP14ClosetSkeleton
    - id: TP14KingRatMigration
    - id: TP14RevenantSpawn

- type: entityTable
  id: TP14ModerateAntagEventsTable
  table: !type:AllSelector
    children:
    - id: TP14DragonSpawn
    - id: TP14NinjaSpawn
    - id: TP14ParadoxCloneSpawn
    - id: TP14SleeperAgents
    - id: TP14ZombieOutbreak
    - id: TP14WizardSpawn
    - id: TP14SpaceChangelingSpawn

- type: entityTable
  id: TP14CargoGiftsTable
  table: !type:GroupSelector # Picks one gift, which then competes with everything else in the pool.
    children:
    - id: TP14GiftsEngineering
    - id: TP14GiftsFireProtection
    - id: TP14GiftsJanitor
    - id: TP14GiftsMedical
    - id: TP14GiftsPizzaPartyLarge
    - id: TP14GiftsPizzaPartySmall
    - id: TP14GiftsSecurityGuns
    - id: TP14GiftsSecurityRiot
    - id: TP14GiftsSpacingSupplies
    - id: TP14GiftsVendingRestock

- type: entityTable
  id: TP14PestEventsTable
  table: !type:AllSelector # Upstream lists cockroaches and mice in both the calm and pest tables (double odds). Once here.
    children:
    - id: TP14CockroachMigration
    - id: TP14MouseMigration
    - id: TP14SnailMigrationLowPop
    - id: TP14RandomCritterHorde
    - id: WhaleMigration

- type: entityTable
  id: TP14GameRulesTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: TP14CalmEventsTable
    - !type:NestedSelector
      tableId: TP14AntagEventsTable
      prob: 0.5 # Only in the pool for half of all event rolls.
    - !type:NestedSelector
      tableId: TP14ModerateAntagEventsTable
      prob: 0.25
    - id: TP14FlashStorm # Was sitting in the upstream antag table.
    - !type:NestedSelector
      tableId: TP14CargoGiftsTable
    - !type:NestedSelector
      tableId: TP14PestEventsTable
    - id: TP14QuietShift

- type: entityTable
  id: TP14DynamicGameRulesTable # Dynamic handles antags itself, so this is the non-antag stuff only.
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: TP14CargoGiftsTable
    - !type:NestedSelector
      tableId: TP14PestEventsTable
    - id: TP14QuietShift

# events

- type: entity
  id: TP14QuietShift # Does nothing. Its weight is the chance an event roll comes up empty.
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 50
    earliestStart: 0
    reoccurrenceDelay: 0 # Default is 30 minutes, which would block back-to-back quiet rolls.

# schedulers

- type: entity
  id: TP14StationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 900 # 15 minutes. Upstream: ~3.5.
    maximumSpanUntilFirstEvent: 600 # Plus up to 10 more.
    minMaxEventTiming:
      min: 600  # 10 minutes. Upstream: 3.
      max: 1200 # 20 minutes. Upstream: 10.
    scheduledGameRules: !type:NestedSelector
      tableId: TP14GameRulesTable

- type: entity
  id: TP14DynamicStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
  
    minimumTimeUntilFirstEvent: 900
    maximumSpanUntilFirstEvent: 600
    minMaxEventTiming:
      min: 600
      max: 1200
    scheduledGameRules: !type:NestedSelector
      tableId: TP14DynamicGameRulesTable

- type: entity
  id: TP14RampingStationEventScheduler
  parent: BaseGameRule
  components:
  - type: RampingStationEventScheduler
    # Time between events is (4 to 12 minutes) / chaos. Chaos starts at a tenth of max and climbs linearly until the end time.
    # Upstream (12 chaos over ~90 min) ends up at an event every 16-80 seconds.
    # This ends up at roughly every 2.5-8 minutes once it peaks.
    averageChaos: 1.5
    averageEndTime: 120 # minutes
    scheduledGameRules: !type:NestedSelector
      tableId: TP14GameRulesTable
