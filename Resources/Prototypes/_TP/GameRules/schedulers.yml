#
# TP14 station event schedulers, tables, and presets' event plumbing.
#
# Mirrors upstream's BasicGameRulesTable / DynamicGameRulesTable but tuned for MRP,
#   also minus anything we have disabled.
#

- type: entityTable
  id: TP14CalmEventsTable
  table: !type:AllSelector
    children:
    - id: TP14AnomalySpawn
    - id: TP14BluespaceArtifact
    - id: TP14BluespaceLocker
    - id: TP14BreakerFlip
    - id: TP14GasLeak
    - id: TP14GreytideVirus
    - id: TP14IonStorm
    - id: TP14KudzuGrowth
    - id: TP14MassHallucinations
    - id: TP14PowerGridCheck
    - id: TP14RandomSentience
    - id: TP14SlimesSpawnHorde
    - id: TP14SolarFlare
    - id: TP14SnakeSpawnHorde
    - id: TP14SpiderClownSpawnHorde
    - id: TP14SpiderSpawnHorde
    - id: TP14VendorMalfunction
    - id: TP14VentClog
    - id: TP14CloudStormEvent
    - id: TP14RainClear

- type: entityTable
  id: TP14AntagEventsTable
  table: !type:AllSelector
    children:
    - id: TP14ClosetSkeleton
    - id: TP14KingRatMigration
    - id: TP14RevenantSpawn

- type: entityTable
  id: TP14ModerateAntagEventsTable
  table: !type:AllSelector
    children:
    - id: TP14DragonSpawn
    - id: TP14NinjaSpawn
    - id: TP14ParadoxCloneSpawn
    - id: TP14SleeperAgents
    - id: TP14ZombieOutbreak
    - id: TP14WizardSpawn
    - id: TP14SpaceChangelingSpawn

- type: entityTable
  id: TP14CargoGiftsTable
  table: !type:GroupSelector
    children:
    - id: TP14GiftsEngineering
    - id: TP14GiftsFireProtection
    - id: TP14GiftsJanitor
    - id: TP14GiftsMedical
    - id: TP14GiftsPizzaPartyLarge
    - id: TP14GiftsPizzaPartySmall
    - id: TP14GiftsSecurityGuns
    - id: TP14GiftsSecurityRiot
    - id: TP14GiftsSpacingSupplies
    - id: TP14GiftsVendingRestock

- type: entityTable
  id: TP14PestEventsTable
  table: !type:AllSelector
    children:
    - id: TP14CockroachMigration
    - id: TP14MouseMigration
    - id: TP14SnailMigrationLowPop
    - id: TP14RandomCritterHorde
    - id: WhaleMigration

- type: entityTable
  id: TP14GameRulesTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: TP14CalmEventsTable
    - !type:NestedSelector
      tableId: TP14AntagEventsTable
      prob: 0.5
    - !type:NestedSelector
      tableId: TP14ModerateAntagEventsTable
      prob: 0.25
    - id: TP14FlashStorm
    - !type:NestedSelector
      tableId: TP14CargoGiftsTable
    - !type:NestedSelector
      tableId: TP14PestEventsTable
    - id: TP14QuietShift

- type: entityTable
  id: TP14DynamicGameRulesTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: TP14CargoGiftsTable
    - !type:NestedSelector
      tableId: TP14PestEventsTable
    - id: TP14QuietShift

# events

# This one does nothing.
- type: entity
  id: TP14QuietShift
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 50
    earliestStart: 0
    reoccurrenceDelay: 0

# schedulers

- type: entity
  id: TP14StationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 900 # 15 minutes.
    maximumSpanUntilFirstEvent: 600 # Plus up to 10 more.
    minMaxEventTiming:
      min: 600  # 10 minutes.
      max: 1200 # 20 minutes.
    scheduledGameRules: !type:NestedSelector
      tableId: TP14GameRulesTable

- type: entity
  id: TP14DynamicStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler

    minimumTimeUntilFirstEvent: 900
    maximumSpanUntilFirstEvent: 600
    minMaxEventTiming:
      min: 600
      max: 1200
    scheduledGameRules: !type:NestedSelector
      tableId: TP14DynamicGameRulesTable

# Time between events is (4 to 12 minutes) / chaos.
# Chaos starts at a tenth of max and climbs linearly until the end time.
# Upstream (12 chaos over ~90 min) ends up at an event every 16-80 seconds.
- type: entity
  id: TP14RampingStationEventScheduler
  parent: BaseGameRule
  components:
  - type: RampingStationEventScheduler
    averageChaos: 1.5
    averageEndTime: 120 # minutes
    scheduledGameRules: !type:NestedSelector
      tableId: TP14GameRulesTable
