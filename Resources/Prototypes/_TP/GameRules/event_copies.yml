# TP14 copies of upstream station events.
# Each one just parents the upstream event, so it behaves identically until you override something.
# To tune one, add the component and only the fields you want to change; the rest is inherited. e.g.:
#   - type: StationEvent
#     weight: 3
# Note: maxOccurrences / reoccurrenceDelay count per prototype ID, so never put both the upstream event
# and its TP14 copy in the same pool.

