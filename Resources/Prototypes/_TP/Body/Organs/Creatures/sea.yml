  components:
  - type: Metabolizer
    metabolizerTypes: [ TP14WaterBreather ]

- type: entity
  id: OrganSeaLandCreatureMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ TP14WaterBreather, Animal ]

- type: entity
  parent: OrganBaseOrganic
  id: OrganSeaCreature
  abstract: true
  suffix: Animal

- type: entity
  parent: OrganSeaCreature
  id: OrganSeaCreatureInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganSeaCreature
  id: OrganSeaLandCreatureInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: [ OrganBaseLungs, OrganSeaCreatureInternal, OrganSeaCreatureMetabolizer ]
