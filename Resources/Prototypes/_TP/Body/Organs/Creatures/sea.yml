  suffix: Trieste
  name: gills

- type: entity
  parent: [ OrganBaseLungs, OrganSeaCreatureInternal, OrganSeaLandCreatureMetabolizer ]
  id: OrganSeaLandCreatureLungs
  suffix: Trieste
  name: gills

- type: entity
  id: OrganTumor
  parent: [ OrganBloodsucker, OrganAnimalStomach ]
  suffix: Trieste
  name: festering tumor
  description: What... what is this?
  components:
  - type: Nymph
    transferMind: true
    entityPrototype: TP14MobMimic

# BASE MOBS #
- type: entity
  parent: [ MobNightVision ]
  id: TP14BaseMobSeaLandCreature
  abstract: true
  components:
  - type: TemperatureProtection
    coolingCoefficient: 0.0
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganSeaLandCreatureLungs
        - id: OrganAnimalHeart
        - id: OrganMothStomach
        - id: OrganAnimalLiver
        - id: OrganAnimalKidneys

- type: entity
  parent: [ MobNightVision ]
  id: TP14BaseMobSeaCreature
  abstract: true
  components:
  - type: TemperatureProtection
    coolingCoefficient: 0.0
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganSeaCreatureLungs
        - id: OrganAnimalHeart
        - id: OrganMothStomach
        - id: OrganAnimalLiver
        - id: OrganAnimalKidneys

- type: entity
  parent: [ MobNightVision ]
